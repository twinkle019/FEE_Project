  <h1 align="center" style="color: #0D6D77;">My Planner</h1>


<h1>📅 Plan Your Tasks</h1>

<div class="planner-container">

  <!-- CALENDAR -->
  <div class="calendar">
    <div class="calendar-header">
      <button id="prev">◀</button>
      <h3 id="monthYear"></h3>
      <button id="next">▶</button>
    </div>

    <!-- NEW WEEK DAYS -->
    <div class="weekdays">
      <div>Sun</div>
      <div>Mon</div>
      <div>Tue</div>
      <div>Wed</div>
      <div>Thu</div>
      <div>Fri</div>
      <div>Sat</div>
    </div>

    <div class="days" id="days"></div>
  </div>

  <!-- TASK PANEL -->
  <div class="task-panel">
    <h3>Tasks for <span id="selectedDate">None</span></h3>

    <input type="text" id="taskInput" placeholder="Enter task">
    <button onclick="addTask()">Add</button>

    <ul id="taskList"></ul>
  </div>

</div>

<script src="planner.js"></script>
</body>
